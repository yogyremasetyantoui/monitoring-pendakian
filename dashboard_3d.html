<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard 3D Monitoring Pendakian</title>
<style>
html,body{margin:0;height:100%;background:#0b1220;font-family:'Segoe UI',Tahoma,sans-serif;color:#e8edf5;overflow:hidden}
#c{position:fixed;inset:0}
.panel{position:fixed;top:12px;left:12px;width:270px;max-height:calc(100% - 24px);overflow:auto;background:rgba(15,23,42,.88);border:1px solid #26344d;border-radius:12px;padding:14px;font-size:13px}
.panel h1{font-size:16px;margin:0 0 4px}
.panel h3{font-size:12px;margin:14px 0 6px;color:#8fa3c0;text-transform:uppercase;letter-spacing:.05em}
.mut{color:#8fa3c0;font-size:11px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats div{background:#16223a;border-radius:8px;padding:8px;text-align:center}
.stats b{display:block;font-size:20px}.stats span{font-size:10px;color:#8fa3c0}
ol,ul{margin:0;padding-left:18px}li{margin:3px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.bar{height:8px;border-radius:4px;background:linear-gradient(90deg,#4b6a88,#22c55e,#eab308,#ef4444);margin-top:4px}
#tip{position:fixed;pointer-events:none;display:none;background:#0f172a;border:1px solid #334a6b;border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.5;z-index:5}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel">
  <h1>🏔️ Monitoring Pendakian 3D</h1>
  <div class="mut" id="src">Memuat…</div>
  <div class="stats">
    <div><b id="sTot">0</b><span>di jalur</span></div>
    <div><b id="sPos">0</b><span>di pos</span></div>
    <div><b id="sAl">0</b><span>alert</span></div>
  </div>
  <h3>Pos terpadat</h3><ol id="topPos"></ol>
  <h3>Segmen jalur terpadat</h3><ol id="topSeg"></ol>
  <h3>Perlu perhatian</h3><ul id="alerts"></ul>
  <div class="row">
    <label><input type="checkbox" id="tgH" checked> Pendaki</label>
    <label><input type="checkbox" id="tgL" checked> Label</label>
    <label><input type="checkbox" id="tgR"> Putar</label>
  </div>
  <h3>Kepadatan</h3>
  <div class="bar"></div>
  <div class="mut" style="display:flex;justify-content:space-between"><span>kosong</span><span>padat</span></div>
  <div class="mut" style="margin-top:8px">Tambahkan <b>?demo</b> di URL untuk data contoh.</div>
</div>
<div id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ====== KONFIGURASI ======
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyKgkvB9lvlKBI_SXjiGaLGpCIUijmmXKprlMdn04k6GOkLsa1BvUJlAqyfRlX127PnvQ/exec';

// ⚠️ GANTI dengan koordinat & ketinggian ASLI tiap pos (dari GPS/Google Earth). Ini hanya contoh.
const POS = [
  {n:'Pos 1', lat:-7.000, lon:107.000, alt:1200},
  {n:'Pos 2', lat:-7.004, lon:107.006, alt:1450},
  {n:'Pos 3', lat:-7.006, lon:107.012, alt:1700},
  {n:'Pos 4', lat:-7.012, lon:107.015, alt:1950},
  {n:'Pos 5', lat:-7.016, lon:107.010, alt:2200},
  {n:'Pos 6', lat:-7.020, lon:107.016, alt:2450},
  {n:'Pos 7', lat:-7.024, lon:107.022, alt:2650},
  {n:'Pos 8', lat:-7.030, lon:107.024, alt:2850},
  {n:'Puncak', lat:-7.034, lon:107.030, alt:3050}
];
const CAP_POS = 10;   // jumlah orang di pos yang dianggap "sangat padat"
const CAP_SEG = 8;    // jumlah orang di segmen jalur yang dianggap "sangat padat"
const S = 0.02, EXAG = 1.4;  // skala: 1 unit = 50 m, ketinggian dilebih-lebihkan 1.4x

// ====== KOORDINAT -> 3D ======
const R = 111320, lat0 = POS[0].lat, lon0 = POS[0].lon, alt0 = POS[0].alt;
const P = POS.map(p => new THREE.Vector3(
  (p.lon - lon0) * R * Math.cos(lat0 * Math.PI / 180) * S,
  (p.alt - alt0) * S * EXAG + 2,
  -(p.lat - lat0) * R * S));
const curve = new THREE.CatmullRomCurve3(P);

// ====== SCENE ======
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b1220);
scene.fog = new THREE.Fog(0x0b1220, 150, 420);
const camera = new THREE.PerspectiveCamera(50, 1, 0.5, 1000);
scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x2a3a2a, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 0.8); sun.position.set(60, 140, 40); scene.add(sun);

const box = new THREE.Box3().setFromPoints(P);
const ctr = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3()).length();
camera.position.set(ctr.x + size * 0.7, ctr.y + size * 0.7, ctr.z + size * 0.9);
const controls = new THREE.OrbitControls(camera, canvas);
controls.target.copy(ctr); controls.enableDamping = true; controls.autoRotateSpeed = 0.6;

// ====== TERRAIN (dibangun di sekitar jalur) ======
const SAMPLES = 300, SP = 18;
const trailPts = Array.from({length: SAMPLES}, (_, i) => curve.getPoint(i / (SAMPLES - 1)));
function terrainH(x, z) {
  let best = 1e9, y = 0;
  for (const p of trailPts) { const d = (p.x - x) ** 2 + (p.z - z) ** 2; if (d < best) { best = d; y = p.y; } }
  const d = Math.sqrt(best);
  const base = y * Math.exp(-(Math.max(0, d - 4) / SP) ** 2) - 0.5;
  return base + Math.sin(x * .35) * Math.cos(z * .3) * 0.9 * Math.min(1, d / 10);
}
(function buildTerrain() {
  const pad = 40, w = size * 0.0 + (box.max.x - box.min.x) + pad * 2, d = (box.max.z - box.min.z) + pad * 2;
  const g = new THREE.PlaneGeometry(w, d, 110, 110); g.rotateX(-Math.PI / 2);
  g.translate((box.max.x + box.min.x) / 2, 0, (box.max.z + box.min.z) / 2);
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3), hMax = box.max.y;
  const cLow = new THREE.Color(0x2d5a3a), cMid = new THREE.Color(0x7a6a4a), cHi = new THREE.Color(0xc9ccd4), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const h = terrainH(pos.getX(i), pos.getZ(i)); pos.setY(i, h);
    const t = Math.max(0, Math.min(1, h / hMax));
    c.copy(t < .55 ? cLow.clone().lerp(cMid, t / .55) : cMid.clone().lerp(cHi, (t - .55) / .45));
    col.set([c.r, c.g, c.b], i * 3);
  }
  g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.computeVertexNormals();
  scene.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({vertexColors:true, roughness:1, flatShading:true})));
})();

// ====== JALUR: 8 segmen, warna = kepadatan ======
const segMeshes = [];
for (let k = 0; k < 8; k++) {
  const pts = Array.from({length: 25}, (_, j) => curve.getPoint((k + j / 24) / 8));
  const m = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 40, 0.5, 8),
    new THREE.MeshStandardMaterial({color:0x4b6a88, emissive:0x4b6a88, emissiveIntensity:.35}));
  scene.add(m); segMeshes.push(m);
}

// ====== POS: batang tinggi = jumlah orang + label ======
const barGeo = new THREE.CylinderGeometry(1.6, 1.6, 1, 20).translate(0, .5, 0);
const posBars = [], posLabels = [];
POS.forEach((p, i) => {
  const bar = new THREE.Mesh(barGeo, new THREE.MeshStandardMaterial({color:0x4b6a88, transparent:true, opacity:.85}));
  bar.position.copy(P[i]); scene.add(bar); posBars.push(bar);
  const cv = document.createElement('canvas'); cv.width = 256; cv.height = 96;
  const tex = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, depthTest:false, transparent:true}));
  sp.scale.set(10, 3.75, 1); sp.renderOrder = 10; scene.add(sp);
  posLabels.push({sp, cv, tex});
});
function drawLabel(i, count) {
  const {cv, tex} = posLabels[i], x = cv.getContext('2d');
  x.clearRect(0, 0, 256, 96); x.fillStyle = 'rgba(15,23,42,.85)'; x.fillRect(8, 8, 240, 80);
  x.fillStyle = '#e8edf5'; x.font = 'bold 30px Segoe UI, sans-serif'; x.textAlign = 'center';
  x.fillText(POS[i].n, 128, 42); x.fillStyle = '#8fa3c0'; x.font = '24px Segoe UI, sans-serif';
  x.fillText(count + ' orang', 128, 74); tex.needsUpdate = true;
}

// ====== DATA ======
const LV_NAME = ['Normal', 'Waspada', 'Siaga', 'Awas', 'SOS'];
const LV_COL = [0x38bdf8, 0xfacc15, 0xfb923c, 0xef4444, 0xe879f9];
const MAT = LV_COL.map(c => new THREE.MeshStandardMaterial({color:c, emissive:c, emissiveIntensity:.45}));
const sphereGeo = new THREE.SphereGeometry(.55, 14, 14);
const hg = new THREE.Group(); scene.add(hg);
const AT_POS = ['REST-BREAK', 'CAMPING-OVERNIGHT', 'SUMMIT-REACHED'];
let ALL = [], beacons = [];

const heat = (c, cap) => c === 0 ? new THREE.Color(0x4b6a88) : new THREE.Color().setHSL(.33 * (1 - Math.min(1, c / cap)), .85, .5);
const hash = s => { let h = 0; for (const ch of String(s)) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// pos terakhir = pos dengan timestamp paling baru (aman untuk naik maupun turun)
function lastPos(r) {
  let b = null;
  for (let i = 1; i <= 9; i++) { const t = r['timePos' + i]; if (t) { const ms = +new Date(t); if (!b || ms > b.ms) b = {pos:i, ms}; } }
  return b;
}
function analyze(r, now) {
  const st = r.latestStatus; if (st === 'CHECK-OUT-EXIT') return null;
  const lp = lastPos(r); if (!lp) return null;
  const dir = /TURUN/i.test(st) ? -1 : 1, nx = lp.pos + dir;
  const pred = (nx >= 1 && nx <= 9 && r['PredPos' + nx]) ? +new Date(r['PredPos' + nx]) : null;
  const delay = pred ? (now - pred) / 3600000 : 0;
  const lvl = st === 'SOS-EMERGENCY' ? 4 : delay >= 3 ? 3 : delay >= 2 ? 2 : delay >= 1 ? 1 : 0;
  const atPos = AT_POS.includes(st) || (now - lp.ms) < 10 * 60000 || nx < 1 || nx > 9;
  let seg = -1, t = 0;
  if (!atPos) {
    const span = pred ? pred - lp.ms : 0;
    t = span > 0 ? Math.min(.98, Math.max(.03, (now - lp.ms) / span)) : .4;
    seg = Math.min(lp.pos, nx) - 1;
  }
  return {r, pos:lp.pos, atPos, seg, t, dir, lvl, delay, lastMs:lp.ms};
}

function render() {
  const now = Date.now(), A = ALL.map(r => analyze(r, now)).filter(Boolean);
  const pc = Array(9).fill(0), sc = Array(8).fill(0);
  A.forEach(a => a.atPos ? pc[a.pos - 1]++ : sc[a.seg]++);

  hg.clear(); beacons = [];
  const ring = Array(9).fill(0);
  A.forEach(a => {
    let p;
    if (a.atPos) {
      const i = ring[a.pos - 1]++, ang = i * 2.399, rad = 2.8 + Math.sqrt(i) * 0.9;
      const x = P[a.pos - 1].x + Math.cos(ang) * rad, z = P[a.pos - 1].z + Math.sin(ang) * rad;
      p = new THREE.Vector3(x, terrainH(x, z) + .7, z);
    } else {
      const u = a.dir > 0 ? (a.seg + a.t) / 8 : (a.seg + 1 - a.t) / 8, h = hash(a.r.uniqueid || a.r.hikername);
      p = curve.getPoint(u); p.x += (h % 7 - 3) * .18; p.z += ((h >> 3) % 7 - 3) * .18; p.y += .9 + ((h >> 6) % 3) * .35;
    }
    const m = new THREE.Mesh(sphereGeo, MAT[a.lvl]); m.position.copy(p); m.userData = a; hg.add(m);
    if (a.lvl === 4) {
      const b = new THREE.Mesh(new THREE.CylinderGeometry(.25, .25, 14, 8),
        new THREE.MeshBasicMaterial({color:0xe879f9, transparent:true, opacity:.6}));
      b.position.copy(p).y += 7; hg.add(b); beacons.push(b);
    }
  });

  segMeshes.forEach((m, k) => { const c = heat(sc[k], CAP_SEG); m.material.color.copy(c); m.material.emissive.copy(c); });
  posBars.forEach((b, i) => {
    const c = heat(pc[i], CAP_POS), h = .6 + pc[i] * .9;
    b.scale.y = h; b.material.color.copy(c);
    posLabels[i].sp.position.set(P[i].x, P[i].y + h + 3, P[i].z); drawLabel(i, pc[i]);
  });

  // panel
  const top = (arr, name) => arr.map((c, i) => ({c, n:name(i)})).filter(o => o.c > 0).sort((a, b) => b.c - a.c).slice(0, 3)
    .map(o => `<li>${esc(o.n)} — <b>${o.c}</b> orang</li>`).join('') || '<li class="mut">belum ada</li>';
  document.getElementById('topPos').innerHTML = top(pc, i => POS[i].n);
  document.getElementById('topSeg').innerHTML = top(sc, k => `${POS[k].n} ↔ ${POS[k + 1].n}`);
  const al = A.filter(a => a.lvl > 0).sort((a, b) => b.lvl - a.lvl).slice(0, 8);
  document.getElementById('alerts').innerHTML = al.map(a =>
    `<li style="color:#${LV_COL[a.lvl].toString(16)}">${esc(a.r.hikername)} · ${LV_NAME[a.lvl]} · ${POS[a.pos - 1].n}</li>`).join('') || '<li class="mut">aman</li>';
  document.getElementById('sTot').textContent = A.length;
  document.getElementById('sPos').textContent = pc.reduce((a, b) => a + b, 0);
  document.getElementById('sAl').textContent = A.filter(a => a.lvl > 0).length;
  applyToggles();
}

// ====== LOAD DATA (live atau demo) ======
function demo() {
  const now = Date.now(), M = 60000, out = [];
  for (let i = 0; i < 70; i++) {
    const lp = 1 + Math.min(8, Math.floor(Math.pow(Math.random(), 1.3) * 9)), up = Math.random() > .25;
    const since = Math.random() * Math.random() * 300;
    const r = {hikername:'Pendaki ' + (i + 1), groupname:'Grup ' + (1 + i % 12), uniqueid:'U' + i, nik:'' + i};
    const T = (k, min) => r['timePos' + k] = new Date(now - min * M).toISOString();
    const pr = k => r['PredPos' + k] = new Date(now - since * M + (70 + Math.random() * 50) * M).toISOString();
    let st;
    if (up) {
      for (let k = 1; k <= lp; k++) T(k, since + (lp - k) * 80);
      st = lp === 9 ? 'SUMMIT-REACHED' : ['CHECK-IN-NAIK', 'CHECK-IN-NAIK', 'CHECK-IN-NAIK', 'REST-BREAK', 'CAMPING-OVERNIGHT'][i % 5];
      if (lp < 9) pr(lp + 1);
    } else {
      for (let k = 1; k <= 9; k++) T(k, k >= lp ? since + (k - lp) * 70 : since + (9 - lp) * 70 + 300 + (9 - k) * 80);
      st = 'CHECK-IN-TURUN'; if (lp > 1) pr(lp - 1);
    }
    if (i === 7) st = 'SOS-EMERGENCY';
    r.latestStatus = st; out.push(r);
  }
  return out;
}
async function load() {
  const el = document.getElementById('src');
  try {
    if (new URLSearchParams(location.search).has('demo')) throw 0;
    const res = await fetch(APPS_SCRIPT_URL + '?dashboard=true'), j = await res.json();
    if (!j.success) throw 0;
    ALL = j.data.map(r => ({...r, hikername:r.hikername || '', groupname:r.groupname || 'Individu',
      uniqueid:r.uniqueid || '', latestStatus:r.LatestStatus || ''}));
    el.textContent = 'Data live · refresh tiap 30 detik';
  } catch (e) { ALL = demo(); el.textContent = 'Mode DEMO (data contoh)'; }
  render();
}

// ====== INTERAKSI ======
function applyToggles() {
  hg.visible = document.getElementById('tgH').checked;
  posLabels.forEach(l => l.sp.visible = document.getElementById('tgL').checked);
  controls.autoRotate = document.getElementById('tgR').checked;
}
['tgH', 'tgL', 'tgR'].forEach(id => document.getElementById(id).addEventListener('change', applyToggles));

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), tip = document.getElementById('tip');
canvas.addEventListener('mousemove', e => {
  mouse.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(mouse, camera);
  const hit = ray.intersectObjects(hg.children.filter(o => o.userData.r))[0];
  if (!hit || !hg.visible) { tip.style.display = 'none'; return; }
  const a = hit.object.userData, r = a.r;
  tip.innerHTML = `<b>${esc(r.hikername)}</b><br>${esc(r.groupname)}<br>${esc(r.latestStatus)}<br>` +
    `${a.atPos ? 'Di ' + POS[a.pos - 1].n : 'Menuju ' + POS[a.pos - 1 + a.dir].n}<br>` +
    `Level: ${LV_NAME[a.lvl]}${a.delay > 0 ? ' (+' + a.delay.toFixed(1) + ' jam)' : ''}`;
  tip.style.left = e.clientX + 14 + 'px'; tip.style.top = e.clientY + 14 + 'px'; tip.style.display = 'block';
});

function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

(function animate(t) {
  requestAnimationFrame(animate);
  beacons.forEach(b => b.material.opacity = .35 + .3 * Math.sin(t / 250));
  controls.update(); renderer.render(scene, camera);
})(0);

load();
setInterval(load, 30000);
setInterval(render, 15000);   // geser posisi pendaki antar refresh data
</script>
</body>
</html>
